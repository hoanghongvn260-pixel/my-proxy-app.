<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyV2 - Ihax Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0d0d0d; color: #ffffff; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        .main-card { background-color: #151515; border: 1px solid #222; border-radius: 20px; }
        .input-field { background-color: #0f0f0f; border: 1px solid #222; color: #ddd; width: 100%; padding: 12px; border-radius: 10px; outline: none; }
        .btn-orange { background: linear-gradient(to right, #f97316, #ea580c); transition: 0.2s; }
        .btn-orange:active { transform: scale(0.98); opacity: 0.9; }
        .btn-green { background: linear-gradient(to right, #22c55e, #16a34a); transition: 0.2s; }
        .btn-green:active { transform: scale(0.98); opacity: 0.9; }
        .btn-dark { background-color: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; }
        .dashed-box { border: 1px dashed #444; background: #1a1a1a; border-radius: 10px; min-height: 45px; display: flex; align-items: center; padding: 0 15px; }
        .status-success { border-color: #22c55e; color: #22c55e; background: rgba(34, 197, 94, 0.05); }
        .status-error { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.05); }
    </style>
</head>
<body class="p-4 flex justify-center">

    <div class="w-full max-w-md">
        <div class="flex justify-between items-center mb-6 px-2">
            <span class="text-gray-400 text-sm">Close</span>
            <div class="text-center">
                <h1 class="text-md font-bold">ProxyV2 - Ihax</h1>
                <p class="text-[9px] text-gray-500 uppercase tracking-widest">mini app</p>
            </div>
            <i class="fas fa-ellipsis-h text-gray-400"></i>
        </div>

        <div class="main-card p-5 mb-4">
            <h3 class="text-orange-400 text-[11px] font-bold mb-4 flex items-center">
                <i class="fas fa-lock mr-2"></i> KÍCH HOẠT & TRẠNG THÁI
            </h3>

            <div class="mb-4">
                <label class="text-[10px] text-gray-500 block mb-1 font-bold">ĐỊA CHỈ IPV4 CÔNG KHAI</label>
                <input type="text" id="ipAddress" class="input-field text-sm" value="14.191.53.14" readonly>
            </div>

            <div class="mb-4">
                <label class="text-[10px] text-gray-500 block mb-1 font-bold">MÃ KEY</label>
                <input type="text" id="keyInput" class="input-field text-sm" placeholder="XXXX-XXXX-XXXX" maxlength="14">
                <p class="text-[10px] text-gray-600 mt-2">Nhập key rồi nhấn Kích Hoạt bên dưới</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="handleActivate()" class="btn-orange py-3 rounded-xl font-bold text-sm">
                    <i class="fas fa-bolt mr-2 text-xs"></i> Kích Hoạt Key
                </button>
                <button onclick="handleCheck()" class="btn-green py-3 rounded-xl font-bold text-sm">
                    <i class="fas fa-chart-bar mr-2 text-xs"></i> Kiểm Tra
                </button>
            </div>

            <div class="space-y-2 mb-4">
                <button class="btn-dark w-full py-3 rounded-xl text-xs flex items-center justify-center">
                    <i class="fas fa-book text-blue-400 mr-2"></i> Hướng Dẫn Proxy
                </button>
                <button onclick="detectIP()" class="btn-dark w-full py-3 rounded-xl text-xs flex items-center justify-center">
                    <i class="fas fa-globe text-blue-300 mr-2"></i> Phát Hiện IP Công Khai
                </button>
                <button onclick="formatKey()" class="btn-dark w-full py-3 rounded-xl text-xs flex items-center justify-center">
                    <i class="fas fa-broom text-yellow-600 mr-2"></i> Tự Động Định Dạng Key
                </button>
            </div>

            <div id="statusBox" class="dashed-box text-[11px] text-orange-200/50">
                Không có key nào đang hoạt động trên tài khoản này.
            </div>
        </div>

        <div class="main-card p-5">
            <h3 class="text-orange-400 text-[11px] font-bold mb-4 flex items-center">
                <i class="fas fa-dna mr-2"></i> THÔNG TIN THIẾT BỊ
            </h3>

            <div class="mb-4">
                <label class="text-[10px] text-orange-600 block mb-1 font-bold">MÃ THIẾT BỊ</label>
                <div id="deviceId" class="text-[10px] text-gray-500 break-all font-mono bg-black/20 p-2 rounded border border-gray-900">
                    dbe95263-56af-4a8c-a5bb-bbe3b93ba7fb
                </div>
            </div>

            <div>
                <label class="text-[10px] text-orange-600 block mb-1 font-bold">NGƯỜI DÙNG</label>
                <div class="text-[11px] text-gray-500 font-mono bg-black/20 p-2 rounded border border-gray-900">
                    7278223515
                </div>
            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH KEY (Thay đổi tại đây)
        const MASTER_KEY = "IHAX-2024-FREE";

        // 1. Lấy IP thực tế
        async function detectIP() {
            const ipInput = document.getElementById('ipAddress');
            const statusBox = document.getElementById('statusBox');
            ipInput.value = "Đang lấy IP...";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                ipInput.value = data.ip;
                statusBox.innerHTML = `✅ Đã phát hiện IP công khai: ${data.ip}`;
                statusBox.className = "dashed-box text-[11px] status-success";
            } catch (e) {
                ipInput.value = "14.191.53.14";
                statusBox.innerText = "Lỗi kết nối API. Đang sử dụng IP mặc định.";
            }
        }

        // 2. Định dạng Key khi gõ
        function formatKey() {
            let input = document.getElementById('keyInput');
            let val = input.value.replace(/[^a-zA-Z0-9]/g, '');
            let parts = val.match(/.{1,4}/g);
            input.value = parts ? parts.join('-').toUpperCase() : val.toUpperCase();
        }

        // 3. Xử lý Kích Hoạt
        function handleActivate() {
            const key = document.getElementById('keyInput').value;
            const statusBox = document.getElementById('statusBox');
            
            if (!key) {
                statusBox.innerText = "Vui lòng nhập mã Key!";
                statusBox.className = "dashed-box text-[11px] status-error";
                return;
            }

            statusBox.innerHTML = "<i class='fas fa-spinner fa-spin mr-2'></i> Đang xác thực Key...";
            
            setTimeout(() => {
                if (key === MASTER_KEY) {
                    statusBox.innerHTML = "✅ Kích hoạt thành công! Proxy đang được thiết lập.";
                    statusBox.className = "dashed-box text-[11px] status-success";
                    alert("Kích hoạt thành công!");
                } else {
                    statusBox.innerHTML = "❌ Mã Key không chính xác hoặc đã hết hạn!";
                    statusBox.className = "dashed-box text-[11px] status-error";
                }
            }, 1200);
        }

        // 4. Nút Kiểm Tra
        function handleCheck() {
            alert("Hệ thống đang hoạt động bình thường.");
        }

        // Tự động chạy khi mở
        window.onload = () => {
            document.getElementById('keyInput').addEventListener('input', formatKey);
            // Có thể gọi detectIP() ở đây nếu muốn tự động lấy IP lúc vào app
        };
    </script>
</body>
</html>
