<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyV2 - Ihax</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #1a1a1a;
            --accent-orange: #ff6a00;
            --accent-green: #28a745;
            --text-main: #ffffff;
            --text-dim: #888;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        .header-card {
            background: linear-gradient(135deg, #2b1b10 0%, #1a1a1a 100%);
            border: 1px solid #3d2b1f;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
        }
        .status-badge {
            background: rgba(255, 106, 0, 0.1);
            color: var(--accent-orange);
            font-size: 10px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 106, 0, 0.3);
        }
        h1 { margin: 0; font-size: 28px; font-weight: 800; }
        .sub-text { color: var(--text-dim); font-size: 13px; margin-top: 10px; }

        .main-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 20px;
        }
        .section-title {
            color: #d4a017;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        label { display: block; color: var(--text-dim); font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }
        .input-group { margin-bottom: 20px; }
        input {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
        }
        /* Style cho ô IP tự động nhảy */
        #ip-display {
            color: #00ff00;
            font-weight: bold;
            border: 1px solid #00ff0044;
        }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button {
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-activate { background: #ff8c00; color: white; }
        .btn-check { background: #28a745; color: white; }
        
        .btn-secondary {
            background: #252525;
            color: #ddd;
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid #333;
            font-size: 13px;
        }
        .btn-get-key {
            background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .footer-note {
            background: rgba(212, 160, 23, 0.05);
            border: 1px dashed #d4a017;
            border-radius: 12px;
            padding: 15px;
            font-size: 13px;
            color: #d4a017;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-card">
        <div class="status-badge">● PROXY SYSTEM ONLINE</div>
        <h1>Proxy FF TH <br>— Ihax —</h1>
        <div class="sub-text">Kích hoạt proxy siêu tốc · Giao diện chiến thuật · Kiểm soát toàn diện</div>
    </div>

    <div class="main-card">
        <div class="section-title">🔒 KÍCH HOẠT & TRẠNG THÁI</div>
        
        <div class="input-group">
            <label>Địa chỉ IPv4 công khai (TỰ ĐỘNG)</label>
            <input type="text" id="ip-display" readonly value="Đang lấy địa chỉ...">
        </div>

        <div class="input-group">
            <label>Mã Key</label>
            <input type="text" id="keyInput" placeholder="XXXX—XXXX—XXXX">
        </div>

        <div class="button-grid">
            <button class="btn-activate" onclick="kichHoat()">⚡ Kích Hoạt Key</button>
            <button class="btn-check" onclick="checkStatus()">📊 Kiểm Tra</button>
        </div>

        <button class="btn-get-key" onclick="getFreeKey()">🎁 LẤY KEY MIỄN PHÍ (GET KEY FREE)</button>

        <button class="btn-secondary">📘 Hướng Dẫn Proxy</button>
        <button class="btn-secondary">🌍 Phát Hiện IP Công Khai</button>
        <button class="btn-secondary">🧹 Tự Động Định Dạng Key</button>

        <div class="footer-note" id="status-msg">
            Sẵn sàng. Kích hoạt key hoặc kiểm tra trạng thái hiện tại.
        </div>
    </div>
</div>

<script>
    // CHỨC NĂNG TỰ ĐỘNG CHECK IP NHƯ CÁI ĐẦU TIÊN
    window.onload = function() {
        // Lấy hostname của trang web hiện tại (tự động nhận link .dev của Codespaces)
        const currentHostname = window.location.hostname;
        const ipInput = document.getElementById('ip-display');
        
        if (currentHostname) {
            // Hiển thị link trực tiếp vào ô input giống image_56.png
            ipInput.value = currentHostname;
        } else {
            ipInput.value = "Không thể lấy địa chỉ";
        }
    };

    function getFreeKey() {
        // THAY LINK RÚT GỌN CỦA BẠN VÀO ĐÂY ĐỂ KIẾM TIỀN
        window.open('https://your-link-rut-gon.com', '_blank');
        alert('Vui lòng vượt qua link quảng cáo để nhận mã Key!');
    }

    function kichHoat() {
        const key = document.getElementById('keyInput').value;
        const msg = document.getElementById('status-msg');
        if(key === "") {
            msg.innerText = "❌ Vui lòng nhập mã Key!";
            msg.style.color = "#ff4444";
        } else if(key === "IHAX-FREE-2026") {
            msg.innerText = "✅ Kích hoạt thành công! Hãy vào game trải nghiệm.";
            msg.style.color = "#00ff00";
        } else {
            msg.innerText = "❌ Key không hợp lệ hoặc đã hết hạn.";
            msg.style.color = "#ff4444";
        }
    }

    function checkStatus() {
        // Hiện thông báo giống hệt trong image_56.png
        alert("Hệ thống: Hoạt động tốt - Độ trễ: 15ms");
    }
</script>

</body>
</html>
