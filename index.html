<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy FF - Phong</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { border: 1px solid #333; padding: 20px; border-radius: 10px; background: #1e1e1e; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #444; background: #2c2c2c; color: white; }
        button { width: 100%; padding: 12px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-key { background: linear-gradient(to right, #ff8c00, #ff4500); color: white; }
        #status-msg { margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>PROXY FF TH - IHAX</h2>
        <p>ĐỊA CHỈ IP: <span style="color: #00ff00;">14.191.53.14</span></p>
        
        <input type="text" id="keyInput" placeholder="Nhập mã Key tại đây...">
        <button class="btn-key" onclick="kichHoat()">Kích Hoạt Key</button>
        
        <div id="status-msg"></div>
    </div>

    <script>
        function kichHoat() {
            const key = document.getElementById('keyInput').value.trim();
            const msg = document.getElementById('status-msg');

            if (key === "") {
                msg.innerHTML = "<span style='color:red;'>❌ Vui lòng nhập mã Key!</span>";
                return;
            }

            msg.innerHTML = "⌛ Đang kiểm tra...";

            setTimeout(() => {
                // ĐOẠN QUAN TRỌNG: Sửa mật khẩu ở đây
                if (key.toLowerCase() === "phongvip123") {
                    msg.innerHTML = "<span style='color:#00ff00;'>✅ KÍCH HOẠT THÀNH CÔNG!</span>";
                } else {
                    msg.innerHTML = "<span style='color:red;'>❌ Mã Key không chính xác hoặc đã hết hạn.</span>";
                }
            }, 1500);
        }
    </script>
</body>
</html>
